name: smoke

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Synthetic end-to-end run (not real data)
        run: python microns_connectivity.py --synthetic --n-shuffles 50 --out /tmp/synthetic_smoke
